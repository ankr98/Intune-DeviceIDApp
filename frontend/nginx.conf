server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compress text-based responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 1. Serve the React App (Frontend)

    # Vite emits content-hashed filenames under /assets — safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be re-fetched so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Backend Container
    location /api/ {
        # 'backend' matches the service name in docker-compose.yml
        # We strip the '/api' prefix before sending to backend (if your backend expects /manufacturers, not /api/manufacturers)
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Graph pushes can take a while for large batches
        proxy_read_timeout 180s;
    }
}
